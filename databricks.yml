# Declarative Automation Bundle for porygon_monitor_wonderbricks.
# Docs: https://docs.databricks.com/dev-tools/bundles/index.html

bundle:
  name: porygon_monitor_wonderbricks

include:
  - resources/**/*.yml

# Python for bundles: resources:load_resources (resources/__init__.py) generates
# the config-driven orchestration jobs (patterns 5 and 6). Needs Databricks CLI
# 0.275+ and `uv sync` (the venv holds databricks-bundles and pyyaml).
python:
  venv_path: .venv
  resources:
    - "resources:load_resources"

variables:
  # Pause switches for the orchestration alternatives (docs/orchestration). Each
  # controls every schedule and trigger of ONE alternative. All default to PAUSED;
  # arm at most one at a time because they all write the same tables.
  event_driven_pause_status:
    description: PAUSED or UNPAUSED for the event-driven jobs (evt_*).
    default: PAUSED
  config_generated_pause_status:
    description: PAUSED or UNPAUSED for the config-generated jobs (gen_*).
    default: PAUSED
  hybrid_pause_status:
    description: PAUSED or UNPAUSED for the hybrid domain jobs (hyb_*).
    default: PAUSED
  silver_schema:
    description: Schema (created by the bundle) that receives the silver tables.
    default: silver
  gold_schema:
    description: Schema (created by the bundle) that receives the gold tables.
    default: gold
  bronze_schema:
    description: Schema (created by the bundle) that receives the silver tables.
    default: bronze
  catalog:
    description: Unity Catalog catalog that receives the loaded tables.
    default: main
  default_schema:
    description: Schema (created by the bundle) that receives the loaded tables.
    default: wanderbricks
  source_catalog:
    description: Catalog holding the Databricks sample data.
    default: samples
  source_schema:
    description: Schema of the Wanderbricks sample dataset.
    default: wanderbricks
  tables:
    description: Comma-separated list of source tables to load.
    default: "bookings,booking_updates,properties,hosts,users,destinations,amenities,property_amenities,reviews,payments,page_views,countries"

targets:
  prod:
    mode: production
    workspace:
      host: https://dbc-7350f2a1-4fb7.cloud.databricks.com
      root_path: /Workspace/Users/anamargaritapreciado@gmail.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: anamargaritapreciado@gmail.com
        level: CAN_MANAGE
      # The CI/CD service principal used by GitHub Actions (Application ID, not a secret)
      - service_principal_name: fac0c18d-0db4-47f4-a020-99739bf422c7
        level: CAN_MANAGE