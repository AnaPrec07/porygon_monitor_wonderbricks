resources:
  jobs:
    download_monitor:
      name: download_monitor
      description: Hourly download monitor refresh - bronze streaming tables, then gold materialized views.
      tags:
        layer: orchestration
        project: download_monitor
      performance_target: STANDARD
      max_concurrent_runs: 1
      # Hourly at minute 20; alerts run a few minutes later. Armed with dm_pause_status.
      schedule:
        quartz_cron_expression: "0 20 * * * ?"
        timezone_id: UTC
        pause_status: ${var.dm_pause_status}
      email_notifications:
        on_failure:
          - ${var.dm_alert_emails}

      environments:
        - environment_key: default
          spec:
            environment_version: "3"

      tasks:
        - task_key: bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.dm_bronze.id}

        - task_key: gold
          depends_on:
            - task_key: bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.dm_gold.id}

        # Skips (and succeeds) while dm_export_s3_url is empty. See docs/download_monitor/export.md.
        - task_key: export
          depends_on:
            - task_key: gold
          environment_key: default
          spark_python_task:
            python_file: ../../src/download_monitor/export/export_to_s3.py
            parameters:
              - --catalog
              - ${var.dm_catalog}
              - --gold-schema
              - ${resources.schemas.dm_gold.name}
              - --export-schema
              - ${resources.schemas.dm_export.name}
              - --s3-url
              - ${var.dm_export_s3_url}
              - --salt-scope
              - ${var.dm_export_salt_scope}
              - --salt-key
              - ${var.dm_export_salt_key}
