resources:
  schemas:
    silver:
      catalog_name: ${var.catalog}
      name: ${var.silver_schema}
      comment: Silver layer built by the ${bundle.name} bundle.

  pipelines:
    average_rating:
      name: average_rating
      catalog: ${var.catalog}
      schema: ${resources.schemas.silver.name}
      serverless: true
      configuration:
        bronze_catalog: ${var.catalog}
        bronze_schema: ${var.bronze_schema}
        min_reviews: "5"
        top_n: "10"
      libraries:
        - file:
            path: ../../src/silver/average_rating.py
