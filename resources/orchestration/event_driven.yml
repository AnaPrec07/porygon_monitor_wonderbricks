# Pattern 4: event-driven orchestration, written by hand.
#
# There is no parent job and no central graph. Every pipeline gets its own job
# that says what it waits for: a table-update trigger on the tables the pipeline
# reads. The only clock is the daily schedule on the bronze job.
#
#   evt_bronze_ingestion  --writes bronze.*-->  evt_silver_average_rating   --> evt_gold_property_type_ratings
#                                          \->  evt_silver_user_categories  --> evt_gold_user_category_summary
#                                        both silver tables ----------------> evt_gold_engagement_kpis
#
# The graph above exists only in this comment and in the trigger table lists.
# tests/test_event_driven_yaml.py rebuilds it from the triggers and compares it
# with config/orchestration/nodes.yml so the two cannot drift silently.
#
# Triggers are created PAUSED. Set event_driven_pause_status=UNPAUSED to arm them.
# Tables a trigger watches must exist when the job is created: run the baseline
# (or the bronze job plus the pipelines) once before the first deploy.
# Only enable one orchestration alternative at a time: they all write the same tables.

resources:
  jobs:
    evt_bronze_ingestion:
      name: evt_bronze_ingestion
      description: Event-driven chain root. Runs the bronze loader daily; everything else reacts to its tables.
      tags: { layer: bronze, pattern: event_driven }
      max_concurrent_runs: 1
      queue: { enabled: true }
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: UTC
        pause_status: ${var.event_driven_pause_status}
      tasks:
        - task_key: bronze_ingestion
          run_job_task:
            job_id: ${resources.jobs.wanderbricks_etl.id}

    evt_silver_average_rating:
      name: evt_silver_average_rating
      description: Refreshes silver average_rating when its bronze inputs change.
      tags: { layer: silver, pattern: event_driven }
      max_concurrent_runs: 1
      queue: { enabled: true }
      trigger:
        pause_status: ${var.event_driven_pause_status}
        table_update:
          condition: ALL_UPDATED
          wait_after_last_change_seconds: 120
          min_time_between_triggers_seconds: 300
          table_names:
            - ${var.catalog}.${var.bronze_schema}.properties
            - ${var.catalog}.${var.bronze_schema}.reviews
      tasks:
        - task_key: silver_average_rating
          max_retries: 1
          min_retry_interval_millis: 60000
          pipeline_task:
            pipeline_id: ${resources.pipelines.average_rating.id}

    evt_silver_user_categories:
      name: evt_silver_user_categories
      description: Refreshes silver user_categories when its bronze inputs change.
      tags: { layer: silver, pattern: event_driven }
      max_concurrent_runs: 1
      queue: { enabled: true }
      trigger:
        pause_status: ${var.event_driven_pause_status}
        table_update:
          condition: ALL_UPDATED
          wait_after_last_change_seconds: 120
          min_time_between_triggers_seconds: 300
          table_names:
            - ${var.catalog}.${var.bronze_schema}.users
            - ${var.catalog}.${var.bronze_schema}.page_views
            - ${var.catalog}.${var.bronze_schema}.bookings
      tasks:
        - task_key: silver_user_categories
          max_retries: 1
          min_retry_interval_millis: 60000
          pipeline_task:
            pipeline_id: ${resources.pipelines.user_categories.id}

    evt_gold_property_type_ratings:
      name: evt_gold_property_type_ratings
      description: Refreshes gold property_type_ratings when silver average_rating changes.
      tags: { layer: gold, pattern: event_driven }
      max_concurrent_runs: 1
      queue: { enabled: true }
      trigger:
        pause_status: ${var.event_driven_pause_status}
        table_update:
          condition: ALL_UPDATED
          wait_after_last_change_seconds: 60
          min_time_between_triggers_seconds: 300
          table_names:
            - ${var.catalog}.${var.silver_schema}.average_rating
      tasks:
        - task_key: gold_property_type_ratings
          max_retries: 1
          min_retry_interval_millis: 60000
          pipeline_task:
            pipeline_id: ${resources.pipelines.gold_property_type_ratings.id}

    evt_gold_user_category_summary:
      name: evt_gold_user_category_summary
      description: Refreshes gold user_category_summary when silver user_categories changes.
      tags: { layer: gold, pattern: event_driven }
      max_concurrent_runs: 1
      queue: { enabled: true }
      trigger:
        pause_status: ${var.event_driven_pause_status}
        table_update:
          condition: ALL_UPDATED
          wait_after_last_change_seconds: 60
          min_time_between_triggers_seconds: 300
          table_names:
            - ${var.catalog}.${var.silver_schema}.user_categories
      tasks:
        - task_key: gold_user_category_summary
          max_retries: 1
          min_retry_interval_millis: 60000
          pipeline_task:
            pipeline_id: ${resources.pipelines.gold_user_category_summary.id}

    evt_gold_engagement_kpis:
      name: evt_gold_engagement_kpis
      description: Refreshes gold engagement_kpis once BOTH silver tables have changed.
      tags: { layer: gold, pattern: event_driven }
      max_concurrent_runs: 1
      queue: { enabled: true }
      trigger:
        pause_status: ${var.event_driven_pause_status}
        table_update:
          condition: ALL_UPDATED
          wait_after_last_change_seconds: 60
          min_time_between_triggers_seconds: 300
          table_names:
            - ${var.catalog}.${var.silver_schema}.average_rating
            - ${var.catalog}.${var.silver_schema}.user_categories
      tasks:
        - task_key: gold_engagement_kpis
          max_retries: 1
          min_retry_interval_millis: 60000
          pipeline_task:
            pipeline_id: ${resources.pipelines.gold_engagement_kpis.id}
